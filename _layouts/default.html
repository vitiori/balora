<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · Balora</title>
  <meta name="description" content="{{ page.description }}">
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/icon.png">
  {% for alt in page.alternates %}<link rel="alternate" hreflang="{{ alt[0] }}" href="{{ site.url }}{{ site.baseurl }}{{ alt[1] }}">
  {% endfor %}
  <style>
    :root {
      --navy: #14213D;
      --mint: #3DD6A5;
      --green: #1FA37A;
      --lavender: #8FA2F0;
      --bg: #F7F8FC;
      --surface: #FFFFFF;
      --text: #1B2235;
      --muted: #5B6288;
      --line: #DDE3FF;
      --link: #2B3770;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0E1628;
        --surface: #16213A;
        --text: #E6EAFF;
        --muted: #9AA6D6;
        --line: #2B3770;
        --link: #8FA2F0;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    header {
      background: var(--navy);
      color: #fff;
    }
    .bar {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 20px;
    }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    nav.langs a {
      color: #fff;
      opacity: .75;
      text-decoration: none;
      margin-left: 12px;
      font-size: 15px;
    }
    nav.langs a[aria-current] { opacity: 1; font-weight: 700; border-bottom: 2px solid var(--mint); }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 30px; line-height: 1.25; margin: 8px 0 4px; }
    h2 { font-size: 21px; margin: 32px 0 8px; }
    h3 { font-size: 18px; margin: 20px 0 6px; }
    a { color: var(--link); }
    .updated { color: var(--muted); font-size: 15px; margin-top: 0; }
    .summary {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--mint);
      border-radius: 12px;
      padding: 4px 18px;
      margin: 20px 0;
    }
    ul { padding-left: 22px; }
    li { margin: 4px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
    .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin: 24px 0; }
    .card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text);
    }
    .card strong { display: block; color: var(--link); }
    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px 32px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="{{ site.baseurl }}{{ page.home | default: '/' }}"><img src="{{ site.baseurl }}/assets/icon.png" alt="">Balora</a>
      <nav class="langs" aria-label="Language">
        {% for alt in page.alternates %}<a href="{{ site.baseurl }}{{ alt[1] }}" lang="{{ alt[0] }}" hreflang="{{ alt[0] }}"{% if alt[0] == page.lang %} aria-current="page"{% endif %}>{% case alt[0] %}{% when 'en' %}English{% when 'es' %}Español{% when 'fr' %}Français{% endcase %}</a>{% endfor %}
      </nav>
    </div>
  </header>
  <main>
{{ content }}
  </main>
  <footer>© 2026 {{ site.owner }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></footer>
</body>
</html>
